<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>D2R Drop Calculator - Diablo 2 Resurrected Item Drop Chances</title>
    <meta name="description" content="Diablo 2 Resurrected drop calculator. See the chance of every item, rune and unique dropping from every monster and area, with Magic Find, player count and Terror Zones. Filter by item stats and monster immunities." />
    <link rel="canonical" href="https://d2-drop-calc.iyican.me/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://d2-drop-calc.iyican.me/" />
    <meta property="og:title" content="D2R Drop Calculator" />
    <meta property="og:description" content="Drop chances for every item, rune and unique from every monster in Diablo 2 Resurrected, with Magic Find, players and Terror Zones." />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "D2R Drop Calculator",
        "url": "https://d2-drop-calc.iyican.me/",
        "description": "Calculates item drop chances from every monster and area in Diablo 2 Resurrected, accounting for Magic Find, player count and Terror Zones.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and WebAssembly",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Emre Iyican", "url": "https://iyican.me/" }
      }
    </script>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1>D2R Drop Calculator</h1>
      <form id="inputs" class="inputs">
        <label title="Number of players in the game (1-8). Lowers the effective &quot;nothing dropped&quot; chance.">
          <span>Players</span>
          <input name="players" type="number" inputmode="numeric" min="1" max="8" step="1" value="1" required />
        </label>
        <label title="Magic Find percentage.">
          <span>Magic Find %</span>
          <input name="magicFind" type="number" inputmode="numeric" min="0" step="1" value="0" required />
        </label>
        <label title="Character level, used only to scale Terror Zone (&quot;terrorized&quot;) rows.">
          <span>Character level</span>
          <input name="characterLevel" type="number" inputmode="numeric" min="1" max="99" step="1" value="99" required />
        </label>
        <button id="run" type="submit">Calculate</button>
      </form>
      <label class="live-filter stat-filter-panel" title="Items whose stats, set bonuses or rune/gem socket bonuses mention this text. Case-insensitive; separate alternatives with commas.">
        <span class="live-head">Filter by item stats <span class="hint">applies instantly</span></span>
        <input id="stat-filter" class="stat-filter" type="search" placeholder="e.g. mana, faster cast" />
      </label>
      <div id="immunities" class="live-filter immunities" role="group" aria-labelledby="immunities-title">
        <div class="live-head">
          <span id="immunities-title">Filter out enemies with immunities</span>
          <span class="hint">applies instantly</span>
        </div>
        <div class="checks">
          <label><input type="checkbox" name="fire" /> Fire</label>
          <label><input type="checkbox" name="cold" /> Cold</label>
          <label><input type="checkbox" name="lightning" /> Lightning</label>
          <label><input type="checkbox" name="poison" /> Poison</label>
          <label><input type="checkbox" name="magic" /> Magic</label>
          <label><input type="checkbox" name="physical" /> Physical</label>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div id="tabs" class="tabs" role="tablist"></div>
      <div class="actions">
        <span id="status" class="status" aria-live="polite"></span>
        <button id="clear" type="button" class="secondary">Clear filters</button>
        <button id="download" type="button" class="secondary">Download CSV</button>
      </div>
    </div>

    <main id="scroller" class="scroller">
      <div id="table" class="table">
        <div class="thead">
          <div id="head-row" class="hrow"></div>
          <div id="filter-row" class="hrow filters"></div>
        </div>
        <div id="body" class="tbody">
          <div id="spacer" class="spacer"></div>
        </div>
      </div>
      <p id="empty" class="empty"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
